[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 5173
  publish = "dist"

[context.production.environment]
  NODE_ENV = "production"

# Optional: set redirects for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
